<text x="100" y="281" font-size="14" fill="#FFFFFF">Lector de pantalla: «imagen, IMG_0234.jpg»</text><text x="450" y="128" font-size="15" font-weight="bold" fill="#D9D8DE">Temporada 2026-27</text><text font-size="12" fill="#E0DFE5"><tspan x="450" y="152">Esta temporada llegan doce estrenos,</tspan><tspan x="450" y="170">tres musicales y un ciclo de teatro</tspan><tspan x="450" y="188">familiar los domingos por la mañana.</tspan><tspan x="450" y="206">Abono de temporada a la venta</tspan><tspan x="450" y="224">desde el 1 de septiembre.</tspan></text><rect x="30" y="330" width="390" height="140" rx="10" fill="#F6C956" stroke="#111015" stroke-width="2"/><rect x="30" y="330" width="195" height="140" rx="10" fill="#E84F49"/><text x="225" y="415" font-size="40" font-weight="bold" text-anchor="middle" fill="#FFFFFF" stroke="#111015" stroke-width="2" paint-order="stroke">¡OFERTA!</text><path d="M60,350 l10,-14 l-2,10 l10,-2 l-12,16 l2,-10 z" fill="#FFFFFF" stroke="#111015" stroke-width="1"/><path d="M370,360 l10,-14 l-2,10 l10,-2 l-12,16 l2,-10 z" fill="#FFFFFF" stroke="#111015" stroke-width="1"/><path d="M70,450 l10,-14 l-2,10 l10,-2 l-12,16 l2,-10 z" fill="#FFFFFF" stroke="#111015" stroke-width="1"/><path d="M380,450 l10,-14 l-2,10 l10,-2 l-12,16 l2,-10 z" fill="#FFFFFF" stroke="#111015" stroke-width="1"/><text x="225" y="492" font-size="13" text-anchor="middle" fill="#3A3846">(cambia de rojo a amarillo 6 veces por segundo)</text><text x="450" y="352" font-size="15" font-weight="bold">Cómo comprar</text><text font-size="14"><tspan x="450" y="378">La adquisición de localidades se</tspan><tspan x="450" y="398">efectuará mediante el procedimiento</tspan><tspan x="450" y="418">telemático habilitado al efecto, previa</tspan><tspan x="450" y="438">cumplimentación de los extremos</tspan><tspan x="450" y="458">consignados en el impreso normalizado.</tspan></text>
